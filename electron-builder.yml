appId: com.razai.sistema
productName: Razai Sistema
copyright: Copyright © 2026 Razai

publish:
  provider: github
  owner: xrazai
  repo: razai-sistema

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - "**/*.node"

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: src/main/services/printer/raw-print.ps1
    to: printer/raw-print.ps1
  - from: node_modules/@tesseract.js-data/por/4.0.0
    to: ocr
    filter:
      - "por.traineddata.gz"
  - from: node_modules/tesseract.js/dist/worker.min.js
    to: ocr/worker.min.js
  - from: node_modules/tesseract.js-core
    to: ocr/core
    filter:
      - "*.js"
      - "*.wasm"

win:
  executableName: Razai Sistema
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "Razai-Sistema-Setup-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Razai Sistema
  uninstallDisplayName: "${productName} ${version}"

portable:
  artifactName: "Razai-Sistema-Portable-${version}.${ext}"
